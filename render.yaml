databases:
  - name: url-shortener-db
    plan: free
    databaseName: url_shortener
    user: user

services:
  # --- Redis ---
  - type: redis
    name: url-shortener-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # --- Backend API ---
  - type: web
    name: url-shortener-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          name: url-shortener-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: url-shortener-redis
          type: redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          name: url-shortener-redis
          type: redis
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: url-shortener-client
          type: web
          property: url
      - key: NODE_ENV
        value: production

  # --- Frontend (static site) ---
  - type: web
    name: url-shortener-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: url-shortener-server
          type: web
          property: url
        # Render sets this at build time; we append /api via a header rewrite or in code
      - key: VITE_SHORT_URL_BASE
        fromService:
          name: url-shortener-server
          type: web
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
